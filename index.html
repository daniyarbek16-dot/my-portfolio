<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Строка чтобы сайт ровно отображался на экранах телефонов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadesOfStarless | Девочка Starless</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-overlay-dark"></div>
    <div class="bg-center-glow"></div>

    <aside class="sidebar">
        <div class="sidebar-menu">
            <div class="sidebar-item active" data-target="home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span class="tooltip">Главная</span>
            </div>
            <div class="sidebar-item" data-target="gallery">
                <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <span class="tooltip">Галерея</span>
            </div>
            <div class="sidebar-divider"></div>
            <a href="https://telegram.org" target="_blank" class="sidebar-item app-link">
                <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.28 7.68-6.92c.34-.31-.07-.48-.52-.19L7.74 13.3 3.64 12c-.89-.28-.9-.89.19-1.32l16.03-6.18c.74-.27 1.39.18 1.16 1.09l-2.72 12.85c-.2 1-.8 1.25-1.63.78l-4.15-3.06-2 1.93c-.22.22-.4.4-.82.4z"/></svg>
                <span class="tooltip">Telegram Web</span>
            </a>
            <a href="https://discord.com" target="_blank" class="sidebar-item app-link">
                <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.094 13.094 0 0 1-1.873-.894.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .077-.011c3.92 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.009c.12.099.246.195.373.289a.077.077 0 0 1-.006.127 12.298 12.298 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
                <span class="tooltip">Discord App</span>
            </a>
            <a href="https://pinterest.com" target="_blank" class="sidebar-item app-link">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.23 2.63 7.85 6.39 9.34-.1-.79-.2-2 .04-2.87.22-.93 1.4-5.96 1.4-5.96s-.36-.71-.36-1.77c0-1.66.96-2.9 2.12-2.9 1 0 1.48.75 1.48 1.65 0 1-.64 2.5-1 3.89-.28 1.18.59 2.14 1.75 2.14 2.1 0 3.72-2.22 3.72-5.43 0-2.84-2.04-4.83-4.96-4.83-3.38 0-5.36 2.54-5.36 5.15 0 1 .39 2.1 1 2.76.1.13.12.24.09.37-.1.4-.33 1.35-.38 1.54-.06.26-.2.32-.47.2-1.78-.83-2.9-3.44-2.9-5.54 0-4.5 3.27-8.65 9.44-8.65 4.96 0 8.81 3.53 8.81 8.26 0 4.93-3.1 8.9-7.42 8.9-1.45 0-2.81-.75-3.27-1.64L9 19.9c-.54 2.08-2 4.67-3 5.3 1.4.43 2.9.67 4.45.67 5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
                <span class="tooltip">Pinterest</span>
            </a>
        </div>
    </aside>

    <header class="navbar">
        <div class="logo">ShadesOfStarless</div>
    </header>

    <main id="home" class="hero-section">
        <!-- Добавил класс anim-left для текста -->
        <div class="hero-content anim-left">
            <span class="subtitle">PROJECT ART</span>
            <h1 class="main-title">Девочка <br><span class="highlight neon-text">ShadesOfStarless</span></h1>
            <p class="description">Интерактивное цифровое пространство и магия синего пламени Азулы.</p>
            <button class="btn-action" id="trigger-gallery">Смотреть Арт</button>
        </div>

        <!-- Добавил класс anim-right для 3D-карточки -->
        <div class="card-container anim-right">
            <div class="card" style="background-image: url('azula.jpg');">
                <div class="card-glow"></div>
                <div class="card-content">
                    <h2>Азула</h2>
                    <p>Принцесса Народа Огня</p>
                </div>
            </div>
        </div>
    </main>

    <section id="gallery" class="gallery-section">
        <h2 class="gallery-title">Разделы <span class="highlight">Portfolio</span></h2>
        
        <div class="gallery-grid">
            <div class="gallery-item album-cutter" data-album="eclipse" style="background-image: url('art1.jpg');">
                <div class="item-overlay"><h3>Затмение</h3></div>
            </div>
            <div class="gallery-item album-cutter" data-album="fire" style="background-image: url('art2.jpg');">
                <div class="item-overlay"><h3>Синее пламя</h3></div>
            </div>
            <div class="gallery-item album-cutter" data-album="lightning" style="background-image: url('art3.jpg');">
                <div class="item-overlay"><h3>Молния</h3></div>
            </div>
        </div>

        <div id="active-album-view" class="active-album-view">
            <h2 id="active-album-title" class="active-album-title">Выберите раздел выше</h2>
            <div id="active-album-grid" class="active-album-grid"></div>
        </div>
    </section>

    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="" alt="View">
        <div id="lightbox-caption"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
